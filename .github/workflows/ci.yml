name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxe
        run: python -m compileall -q app api server.py main.py
      - name: Executar testes de unidade, integracao e sistema
        run: python -m unittest discover -s tests -v
